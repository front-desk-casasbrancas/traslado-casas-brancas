function pick(o){ return o ? (o[LANG]||o.en||o.pt) : ''; }
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderLang(){ document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG)); }
function renderChrome(){ document.getElementById('back').innerHTML=esc(UI.back[LANG]); document.getElementById('sync').textContent=UI.sync[LANG]; }
function renderTabs(){
  const t=document.getElementById('tabs');
  t.style.display=CASA.menus.length>1?'flex':'none';
  t.innerHTML=CASA.menus.map((m,i)=>`<button class="tab ${i===menuIdx?'on':''}" onclick="setMenu(${i})">${esc(pick(m.rotulo))}</button>`).join('');
}
function renderReserva(){
  const msg=UI.reservarMsg[LANG]+CASA.nome+'.';
  const wa=`https://wa.me/${CASA.wa}?text=${encodeURIComponent(msg)}`;
  let h='';
  if(CASA.online) h+=`<a class="btn btn-p" href="${CASA.online}" target="_blank" rel="noopener">${esc(UI.online[LANG])}</a>`;
  h+=`<a class="btn btn-s" href="${wa}" target="_blank" rel="noopener">${esc(UI[CASA.waKey][LANG])}</a>`;
  document.getElementById('reserva').innerHTML=h;
}
function renderConteudo(){
  const menu=CASA.menus[menuIdx]; let h='';
  if(menu.intro) h+=`<div class="intro">${esc(pick(menu.intro))}</div>`;
  menu.sections.forEach(s=>{
    if(s.titulo){ h+=`<div class="sec"><h2>${esc(pick(s.titulo))}</h2><div class="rule"></div>`;
      if(s.sub) h+=`<div class="sub">${esc(pick(s.sub))}</div>`; h+=`</div>`; }
    s.itens.forEach(it=>{
      const right=it.precoTxt?esc(it.precoTxt):(it.preco?`<small>R$</small>${esc(it.preco)}`:'');
      h+=`<div class="item"><div class="ihead"><div><div class="iname">${esc(pick(it.nome))}</div>`;
      if(it.meta) h+=`<div class="imeta">${esc(it.meta)}</div>`;
      h+=`</div>`; if(right) h+=`<div class="iprice">${right}</div>`; h+=`</div>`;
      if(it.desc&&it.desc.length) h+=`<div class="idesc">`+it.desc.map(d=>`<div>${esc(pick(d))}</div>`).join('')+`</div>`;
      if(it.tags&&it.tags.length) h+=`<div class="tags">`+it.tags.map(k=>`<span class="tag">${esc(TAGS[k][LANG])}</span>`).join('')+`</div>`;
      h+=`</div>`;
    });
  });
  if(menu.footer&&menu.footer.length) h+=`<div class="footer">`+menu.footer.map(f=>`<div>${esc(pick(f))}</div>`).join('')+`</div>`;
  document.getElementById('conteudo').innerHTML=h; window.scrollTo({top:0});
}
function renderAll(){ renderLang();renderChrome();renderTabs();renderReserva();renderConteudo(); }
function setMenu(i){ menuIdx=i; renderTabs(); renderConteudo(); }
document.querySelectorAll('#langbar button').forEach(b=>b.addEventListener('click',()=>{
  LANG=b.dataset.l; localStorage.setItem('cb_lang',LANG); renderAll();
}));
renderAll();
</script>
<script src="cb-versao.js"></script>
</body>
</html>
